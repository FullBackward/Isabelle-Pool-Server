[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isabelle-pool-server"
version = "0.1.0"
description = "Isabelle as a managed, concurrent service: a pool of warm prover sessions behind a REST API, with leases, memory-aware admission, metrics, and MCP servers for LLM agents."
# Runtime deps of the server — the single source of truth (the Dockerfile
# installs exactly these plus the `mcp` extra). fastapi[standard] already
# brings uvicorn, httpx and watchfiles. The async client is a separate
# distribution (client/pyproject.toml, httpx only).
dependencies = [
    "fastapi[standard]",
    "py4j",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
]

[project.optional-dependencies]
# MCP servers (mcp_servers/): <2 because mcp 2.0 removed mcp.server.fastmcp.
mcp = ["mcp>=1.2,<2"]
# evaluation/: runs_analysis.ipynb (pandas, matplotlib) and the cross-MCP
# comparison harness (openai, pyyaml).
eval = ["pandas", "matplotlib", "openai", "pyyaml"]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pylint",
    "isort",
    "black",
    "mypy",
]

[tool.setuptools]
include-package-data = true

# The async client is its own distribution (client/pyproject.toml,
# `pip install -e ./client`) and must stay independent of the server; the MCP
# servers depend on the client only (tests/test_dependency_rules.py).
[tool.setuptools.packages.find]
include = ["server*"]

[tool.pylint.main]
ignore-paths = [
    ".*venv",
]
disable = [
    # super-linter cannot install dependencies
    "import-error",
    # Code lines already checked by black and length of strings doesn't need to be capped
    # (will interfere with expect tests)
    "line-too-long",
]

[tool.mypy]
disable_error_code = [
    "import-untyped",
]
strict = true

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.coverage.run]
source = ["server", "client"]

[tool.pytest.ini_options]
# Only tests/ is the unit suite; archive/ holds frozen 1.0/2.0 test files that no
# longer import, and evaluation/ scripts are not tests.
testpaths = ["tests"]
addopts = ""
