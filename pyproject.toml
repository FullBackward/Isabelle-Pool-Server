[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isabelle-gym"
version = "0.1.0"
dependencies = [
    "py4j",
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pylint",
    "isort",
    "black",
    "mypy",
]

[tool.setuptools]
include-package-data = true

# The async client is its own distribution (client/pyproject.toml,
# `pip install -e ./client`) and must stay independent of the server; the MCP
# servers depend on the client only (tests/test_dependency_rules.py).
[tool.setuptools.packages.find]
include = ["server*"]

[tool.pylint.main]
ignore-paths = [
    ".*venv",
]
disable = [
    # super-linter cannot install dependencies
    "import-error",
    # Code lines already checked by black and length of strings doesn't need to be capped
    # (will interfere with expect tests)
    "line-too-long",
]

[tool.mypy]
disable_error_code = [
    "import-untyped",
]
strict = true

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.coverage.run]
source = ["server", "client"]

[tool.pytest.ini_options]
# Only tests/ is the unit suite; archive/ holds frozen 1.0/2.0 test files that no
# longer import, and evaluation/ scripts are not tests.
testpaths = ["tests"]
addopts = ""
