services:
  isabelle-pool-server:
    # No platform pin: build/run natively for the host architecture. The old
    # `platform: linux/amd64` forced qemu-x86_64 emulation on Apple Silicon
    # (5-20x slower Isabelle; session creation took many minutes). The
    # Dockerfile selects the matching Isabelle tarball (x86-64 vs ARM) itself.
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Isabelle distribution name (RCs: website-<name>/dist; finals: dist/).
        ISABELLE_VERSION: ${ISABELLE_VERSION:-Isabelle2026-RC2}
    # Explicit image name: without it compose derives one from the checkout
    # directory (it used to be `isabellegym-isabelle-gym`).
    image: isabelle-pool-server:local
    container_name: isabelle-pool-server
    volumes:
      - .:/app
      - isabelle_user_data:/root/.isabelle
    env_file:
      - .env
    # `environment` entries override .env on conflict
    environment:
      - ISABELLE_HOME=/opt/isabelle
      - PYTHONPATH=/app
    working_dir: /app
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    # Real cgroup ceiling so the memory admission gate bites at a known limit
    # and cAdvisor can report OOM events. Raise for bigger concurrent sweeps.
    # NOTE: must stay BELOW the Docker VM's own memory (this machine: ~15.6 GiB)
    # or the cgroup-aware gate goes blind — 24g on a 16 GB box means the VM
    # OOMs before the gate ever fires.
    mem_limit: 14g
    # Entrypoint (server/repl/Admin/container_entrypoint.sh) re-registers Isabelle
    # components into the isabelle_user_data volume on every start
    # (docs/ISSUES.md Bug 7), ensures the ML heap cap in the user settings,
    # then starts the API server in the foreground — `docker compose up -d`
    # gives a running server, no manual exec needed. Logs:
    # `docker compose logs -f isabelle-pool-server`.
    command: ./server/repl/Admin/container_entrypoint.sh
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: isabelle-prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: isabelle-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: isabelle-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  isabelle_user_data:
  prometheus_data:
  grafana_data: