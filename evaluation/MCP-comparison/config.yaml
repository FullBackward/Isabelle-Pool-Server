# MCP comparison harness configuration
# Copy this to config.local.yaml and override values, or set env vars.

model:
  provider: deepseek                 # "deepseek", "kimi", or any OpenAI-compatible
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  model_id: deepseek-v4-pro
  temperature: 0.3
  # Reasoning models spend max_tokens on HIDDEN reasoning first. 4096 caused the
  # "empty response" runs: the model burned exactly 4096 tokens thinking and was
  # cut off (finish_reason=length) before emitting any content/tool call, and the
  # "JSONDecodeError: Unterminated string" runs (cut mid tool-arguments). Keep
  # this high; lower it only if the provider rejects the value.
  max_tokens: 32768

budgets:
  max_rounds: 100
  problem_wall_cap_seconds: 2400     # 20 min per problem
  tool_timeout_seconds: 300         # 5 min per MCP tool call
  repeats: 5

paths:
  problems_dir: MCP-comparison/problems
  runs_dir: MCP-comparison/runs

# --- Universal system prompt (applied to ALL three MCPs) ---
# Leave commented-out or empty to disable.  Use one of the suggested prompts
# below, or write your own.  The prompt is injected as a single system message
# before the first user message.
system_prompt: |
  You are an expert in Isabelle/HOL theorem proving with access to MCP tools.


# --- Prompt variants (run_isabelle_pool_server_lsp.py --prompt-variant NAME) ---
# Without --prompt-variant the runner uses its built-in prompt, byte for byte
# (the baseline of every earlier run). A variant REPLACES the user prompt body;
# `{file_path}` is substituted. Results and logs go to runs/<system>/<NAME>/
# and each row carries `variant: NAME`.
prompts:
  fill_sorries: |
    You are an expert interactive theorem prover assistant for Isabelle/HOL. Your job is to construct a complete, correct Isar proof of the target theorem.

    WORKFLOW (file-based):
    - The problem file is on disk at: {file_path}
    - Read it with read_file(); modify it with write_file(content) — ALWAYS the
      COMPLETE new file content. The Isabelle MCP observes your edit automatically.
    - The file contains the target theorem with a `sorry`. Replace the sorry with a
      real proof. NEVER leave `sorry` or `oops` in the final file.
    - After EVERY write_file, call isabelle_diagnostic_messages(file_path) and fix
      every error it reports (it gives line/column, command kind, and the message).
    - Inspect goals mid-proof with isabelle_goal(file_path, line) (1-based lines),
      facts with isabelle_query(file_path, "find_theorems ...") / isabelle_local_facts,
      and symbols with isabelle_hover_info / isabelle_definition.
    - Check the overall state with isabelle_proof_state(file_path).

    SOLVER RULE — NEVER write external-solver invocations (smt, metis, cvc5,
    vampire, z3, verit, e, spass, etc.) in your proof text yourself. Instead,
    structure the proof as Isar steps (`have`, `show`, `obtain`, `apply` chains)
    and write `sorry` at EVERY step you cannot close with simp/linarith/argo/
    auto/presburger. Then call isabelle_fill_sorries(file_path): the server runs
    sledgehammer on every `sorry` at once and returns `patched_text` with the
    proved ones replaced VERBATIM plus the lines still `sorry`. Write
    patched_text to the file with write_file, verify with
    isabelle_diagnostic_messages, and for the remaining `sorry`s split the goal
    into smaller `have` steps and call isabelle_fill_sorries again. If the tool
    answers `continuing: true`, call isabelle_fill_status(file_path) until it is
    done. Use isabelle_sledgehammer only for a single goal you want to try
    immediately; isabelle_multi_attempt(file_path, line, candidates) tests
    alternatives without modifying your file.

    DONE CRITERIA — the theorem is proved ONLY when: the file has NO `sorry`/`oops`,
    isabelle_diagnostic_messages reports no errors, and isabelle_proof_state shows
    proof_finished=true. When all hold, reply with the single word DONE.

# Per-system command/transport settings
mcp_servers:
  isabelle_pool_server:
    command: [python, -m, mcp_servers.stepwise.app]
    env:
      PYTHONPATH: .
      ISABELLE_MCP_GYM_URL: http://localhost:8000

  isabelle_pool_server_lsp:
    # The LSP-like file-sync MCP (mcp_servers.lsp); read-only MCP tools — the
    # runner adds local read_file/write_file tools over a per-attempt workdir.
    command: [python, -m, mcp_servers.lsp.app]
    env:
      PYTHONPATH: .
      ISABELLE_MCP_LSP_GYM_URL: http://localhost:8000
      ISABELLE_MCP_LSP_TRANSPORT: stdio

  isabelle_mcp:
    # Two ways to run:
    # (a) Native: patched Isabelle + isabelle-mcp on host PATH
    #     command: [isabelle-mcp]
    # (b) Container: server lives inside a running Docker container
    #     command: [docker, exec, -i, isabelle-eval, isabelle-mcp]
    command: [isabelle-mcp]
    env: {}

  autocorrode_iq:
    # Stdio bridge to the I/Q TCP server inside jEdit.
    command: [python, /path/to/AutoCorrode/iq/iq_bridge.py]
    env:
      IQ_MCP_BRIDGE_PORT: "8765"
      # MCP stdio is UTF-8; stop Python from inheriting the OS locale (GBK).
      PYTHONUTF8: "1"

# Container-mode path translation for Isabelle-MCP.
# Set container_name if the MCP server runs inside Docker; leave null for native mode.
# The harness writes .thy files to host_work_dir and translates paths to container_work_dir
# before calling MCP tools.
isabelle_mcp_container:
  container_name: null           # e.g. isabelle-eval
  host_work_dir: null            # absolute host path, e.g. C:/Users/winst/GitHub/Isabelle-MCP/container/work
  container_work_dir: /work

arbiter:
  gym_url: http://localhost:8000
